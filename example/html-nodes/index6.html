<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Index6 — Systems Graph</title>
  <script src="https://d3js.org/d3.v4.min.js"></script>
  <style>
    body { font-family: "PT Sans", sans-serif; margin: 0; overflow: hidden; }
    svg { width: 100vw; height: 100vh; background: #000; }
    text { fill: white; font-size: 10px; pointer-events: none; }
  </style>
</head>
<body>
  <svg></svg>
  <script>
    // === Адаптер для systems.json ===
    function convertSystemsToGraph(data) {
      const nodes = [];
      const links = [];

      if (!data || !data.systems) return { nodes, links };

      data.systems.forEach((system, i) => {
        const sysName = system.name || `System_${i}`;
        nodes.push({ id: sysName, label: sysName, group: 1 });

        if (system.stars && Array.isArray(system.stars)) {
          system.stars.forEach((star, j) => {
            const starId = `${sysName}_${star.name || "Star_" + j}`;
            nodes.push({
              id: starId,
              label: star.name || `Star_${j}`,
              name: star.name || "",
              magnitude: star.magnitude || "",
              class: star.class || "",
              group: 2
            });
            links.push({ source: sysName, target: starId });
          });
        }
      });
      return { nodes, links };
    }

    // === Загрузка данных ===
    d3.json("systems.json").then(function(hotmapsRaw) {
      const graph = convertSystemsToGraph(hotmapsRaw);

      // 🔧 Преобразуем source/target → индексы узлов
      const nodeIndex = new Map(graph.nodes.map((n, i) => [n.id, i]));
      graph.links = graph.links
        .filter(l => nodeIndex.has(l.source) && nodeIndex.has(l.target))
        .map(l => ({
          source: nodeIndex.get(l.source),
          target: nodeIndex.get(l.target)
        }));

      console.log("✅ Граф загружен:", graph);

      // === Создание графа ===
      const svg = d3.select("svg"),
            width = +svg.attr("width"),
            height = +svg.attr("height");

      const simulation = d3.forceSimulation()
          .force("link", d3.forceLink().id((d, i) => i).distance(80))
          .force("charge", d3.forceManyBody().strength(-40))
          .force("center", d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));

      const link = svg.append("g")
          .attr("class", "links")
        .selectAll("line")
        .data(graph.links)
        .enter().append("line")
          .attr("stroke", "#888")
          .attr("stroke-width", 0.7);

      const node = svg.append("g")
          .attr("class", "nodes")
        .selectAll("circle")
        .data(graph.nodes)
        .enter().append("circle")
          .attr("r", 5)
          .attr("fill", d => d.group === 1 ? "#ffcc00" : "#00ccff")
          .call(d3.drag()
              .on("start", dragstarted)
              .on("drag", dragged)
              .on("end", dragended));

      // === строки 622–624 сохранены ===
      node.append("title")
        .text(d =>
          `${d.label || "frequency cluster"}\n` +
          (d.name ? `Name: ${d.name}\n` : "") +
          (d.magnitude ? `Magnitude: ${d.magnitude}\n` : "") +
          (d.class ? `Class: ${d.class}\n` : "")
        );

      const labels = svg.append("g")
        .selectAll("text")
        .data(graph.nodes.filter(d => d.group === 2))
        .enter()
        .append("text")
        .text(d => d.name ? `${d.name} (${d.class})` : d.label)
        .attr("dy", -8);

      simulation
          .nodes(graph.nodes)
          .on("tick", ticked);

      simulation.force("link")
          .links(graph.links);

      function ticked() {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);

        labels
            .attr("x", d => d.x + 6)
            .attr("y", d => d.y + 3);
      }

      function dragstarted(d) {
        if (!d3.event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(d) {
        d.fx = d3.event.x;
        d.fy = d3.event.y;
      }

      function dragended(d) {
        if (!d3.event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

    }).catch(function(error) {
      console.error("Ошибка загрузки systems.json:", error);
    });
  </script>
</body>
</html>
